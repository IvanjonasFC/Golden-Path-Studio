        <text x="540" y="262" fill="#4b5563" font-size="11">2h ago</text>
        <text x="725" y="262" fill="#9ca3af" font-size="14" font-weight="700">•••</text>
        <line x1="40" y1="286" x2="760" y2="286" stroke="#f3f4f6"/>

        <!-- Pagination -->
        <text x="65" y="415" fill="#6b7280" font-size="11">Showing 1 to 10 of 124 entries</text>
        <rect x="640" y="400" width="50" height="24" rx="4" fill="#f3f4f6"/>
        <text x="665" y="416" text-anchor="middle" fill="#4b5563" font-size="10">Prev</text>
        <rect x="700" y="400" width="50" height="24" rx="4" fill="#111827"/>
        <text x="725" y="416" text-anchor="middle" fill="#ffffff" font-size="10">Next</text>
      </svg>