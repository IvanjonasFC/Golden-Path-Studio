name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Type Check
        run: npm run typecheck

  verification:
    name: Verification Runtime & CMS Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run CMS Pipeline Tests
        run: npm run test:cms
      - name: Run Verification Runtime Tests
        run: npm run test:verification

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, verification]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Linter (if present)
        run: npm run lint --if-present
      - name: Build Application
        run: npm run build
        env:
          DB_PATH: ./data/catalog.db
