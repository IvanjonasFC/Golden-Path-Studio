<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
        <rect width="100%" height="100%" fill="#fafafa"/>
        
        <!-- Header Toolbar -->
        <rect x="0" y="0" width="800" height="56" fill="#ffffff"/>
        <line x1="0" y1="56" x2="800" y2="56" stroke="#e5e7eb"/>
        <text x="40" y="34" fill="#111827" font-size="15" font-weight="800">LIGHT MODE USER DATA TABLE WITH FILTERS</text>
        
        <rect x="460" y="14" width="180" height="28" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
        <text x="475" y="32" fill="#9ca3af" font-size="11">Filter records...</text>
        <rect x="655" y="14" width="105" height="28" rx="6" fill="#111827"/>
        <text x="707" y="32" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Export CSV</text>

        <!-- Table Container -->
        <rect x="40" y="80" width="720" height="360" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
        
        <!-- Table Head -->
        <rect x="40" y="80" width="720" height="38" rx="8" fill="#f9fafb"/>
        <line x1="40" y1="118" x2="760" y2="118" stroke="#e5e7eb"/>
        <text x="65" y="104" fill="#6b7280" font-size="11" font-weight="700">MEMBER</text>
        <text x="280" y="104" fill="#6b7280" font-size="11" font-weight="700">ROLE</text>
        <text x="420" y="104" fill="#6b7280" font-size="11" font-weight="700">STATUS</text>
        <text x="540" y="104" fill="#6b7280" font-size="11" font-weight="700">LAST ACTIVE</text>
        <text x="710" y="104" fill="#6b7280" font-size="11" font-weight="700">ACTIONS</text>

        <!-- Row 1 -->
        <circle cx="80" cy="146" r="14" fill="#3b82f6"/>
        <text x="80" y="151" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">AV</text>
        <text x="105" y="144" fill="#111827" font-size="12" font-weight="700">Alex Vance</text>
        <text x="105" y="158" fill="#6b7280" font-size="10">alex@goldenpath.dev</text>
        <rect x="280" y="137" width="56" height="18" rx="4" fill="#eff6ff"/>
        <text x="308" y="150" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="700">ADMIN</text>
        <rect x="420" y="137" width="56" height="18" rx="9" fill="#dcfce7"/>
        <text x="448" y="150" text-anchor="middle" fill="#15803d" font-size="10" font-weight="700">ACTIVE</text>
        <text x="540" y="150" fill="#4b5563" font-size="11">Just now</text>
        <text x="725" y="150" fill="#9ca3af" font-size="14" font-weight="700">•••</text>
        <line x1="40" y1="174" x2="760" y2="174" stroke="#f3f4f6"/>

        <!-- Row 2 -->
        <circle cx="80" cy="202" r="14" fill="#8b5cf6"/>
        <text x="80" y="207" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">SC</text>
        <text x="105" y="200" fill="#111827" font-size="12" font-weight="700">Sarah Chen</text>
        <text x="105" y="214" fill="#6b7280" font-size="10">sarah@hyper.ai</text>
        <rect x="280" y="193" width="68" height="18" rx="4" fill="#f5f3ff"/>
        <text x="314" y="206" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="700">ENGINEER</text>
        <rect x="420" y="193" width="56" height="18" rx="9" fill="#dcfce7"/>
        <text x="448" y="206" text-anchor="middle" fill="#15803d" font-size="10" font-weight="700">ACTIVE</text>
        <text x="540" y="206" fill="#4b5563" font-size="11">12m ago</text>
        <text x="725" y="206" fill="#9ca3af" font-size="14" font-weight="700">•••</text>
        <line x1="40" y1="230" x2="760" y2="230" stroke="#f3f4f6"/>

        <!-- Row 3 -->
        <circle cx="80" cy="258" r="14" fill="#f59e0b"/>
        <text x="80" y="263" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">ML</text>
        <text x="105" y="256" fill="#111827" font-size="12" font-weight="700">Marcus Lind</text>
        <text x="105" y="270" fill="#6b7280" font-size="10">m.lind@nexus.io</text>
        <rect x="280" y="249" width="60" height="18" rx="4" fill="#fef3c7"/>
        <text x="310" y="262" text-anchor="middle" fill="#b45309" font-size="10" font-weight="700">DESIGN</text>
        <rect x="420" y="249" width="60" height="18" rx="9" fill="#fef3c7"/>
